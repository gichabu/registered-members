
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Registration | SPI 2201</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../script/script.js" defer></script>
</head>
<body>

    <header>
        <h1>Member Registration</h1>
        <p>SPI 2201 - Web Application Development I</p>
        <p>Kirinyaga University</p>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to dark mode">
            Dark mode
        </button>
    </header>

    <main>
        <section class="form-container">
            <h2>Register a New Member</h2>

            <p id="message" role="status"></p>

            <form id="registrationForm">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="0712345678" required>

                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                </select>

                <label for="password">Password</label>
                <input type="password" id="password" minlength="8"
                       placeholder="At least 8 characters" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Repeat password" required>

                <button type="submit">Register Member</button>
                <button type="reset" class="clear-button">Clear Form</button>
            </form>
        </section>

        <section class="members-container">
            <h2>Registered Members</h2>

            <input type="search" id="searchInput"
                   placeholder="Search by name, email or phone">

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="membersTable">
                        <tr>
                            <td colspan="5">No members registered yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>SPI 2201 | Web Application Development I | 2026/2027</p>
    </footer>

</body>
</html>
